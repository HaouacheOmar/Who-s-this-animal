# Local dev stack (SYSTEM_DESIGN.md §5). Run from the repo root:
#   docker compose -f docker/docker-compose.yml up --build
name: whos-this-animal

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: whos_this_animal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]  # 5433 on the host: a local Postgres service already uses 5432
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  model:
    build: { context: .., dockerfile: docker/model.Dockerfile }
    environment:
      MODEL_DIR: /artifacts
    volumes: [../model/artifacts:/artifacts:ro]
    ports: ["50051:50051"]
    restart: unless-stopped  # waits for model/artifacts to exist (python model/training/compare.py)

  server:
    build: { context: .., dockerfile: docker/server.Dockerfile }
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      MODEL_GRPC_ADDR: model:50051
      MODEL_META: /artifacts/meta.json
      OLLAMA_URL: http://ollama:11434
      EMAIL_HOST: mailpit
      MEDIA_ROOT: /media
    volumes:
      - ../server:/app/server
      - ../proto:/app/proto:ro
      - ../model/artifacts:/artifacts:ro
      - media:/media
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      mailpit: { condition: service_started }

  client:
    build: { context: .., dockerfile: docker/client.Dockerfile }
    environment:
      API_URL: http://server:8000
      VITE_POLL: "1"
    volumes:
      - ../client:/app
      - /app/node_modules  # keep the image's Linux node_modules, not the host's
    ports: ["5173:5173"]
    depends_on: [server]

  ollama:
    image: ollama/ollama
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  media:
  ollama:
